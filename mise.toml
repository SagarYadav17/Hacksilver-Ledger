[tools]
java = "21"

[env]
ANDROID_HOME = "{{ env.HOME }}/Android/Sdk"
ANDROID_SDK_ROOT = "{{ env.ANDROID_HOME }}"
_.path = [
  "{{ env.ANDROID_HOME }}/emulator",
  "{{ env.ANDROID_HOME }}/platform-tools",
]

[tasks.install]
description = "Install JavaScript dependencies"
run = "bun install"

[tasks.start]
description = "Start the Expo development server"
run = "bun run start"

[tasks.typecheck]
description = "Run TypeScript checks"
run = "bun run typecheck"

[tasks.test]
description = "Run the Bun test suite"
run = "bun test"

[tasks.lint]
description = "Run Oxlint"
run = "bun run lint"

[tasks.format]
description = "Check Oxfmt formatting"
run = "bun run format:check"

[tasks.android]
description = "Build and run the Android app"
run = "bun run android"
